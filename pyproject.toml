[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-ai"
version = "0.24.0"
description = "Training-time privacy for AI: tamper-evident PII-scrub + data-lineage ledger that emits signed governance evidence for the presidio-hardened-* suite."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Presidio Security" }]
keywords = [
    "presidio",
    "hardening",
    "security-engineering",
    "ai",
    "privacy",
    "differential-privacy",
    "pii",
    "eu-ai-act",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
nlp = ["presidio-analyzer>=2.2", "spacy>=3.7"]
torch = ["opacus>=1.4", "torch>=2.0"]
crypto = ["cryptography>=42"]
mpc = ["cryptography>=42", "uvicorn>=0.30", "starlette>=0.37"]
# [zk] activates the audited Ristretto255 + Bulletproofs backend (ADR-0004), built from
# rust/ via maturin (`maturin build -m rust/Cargo.toml`) -> the `presidio_ai_zk` wheel.
# It is a drop-in accelerator: absent it, get_backend() falls back to the pure-Python MODP
# proofs, so this extra stays installable (no-op) and `pip install ...[zk]` always works.
zk = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "cryptography>=42",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
pai = "presidio_ai.cli:app"

[project.urls]
Homepage = "https://github.com/presidio-v/presidio-hardened-ai"
Source = "https://github.com/presidio-v/presidio-hardened-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_ai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# B008: Typer requires Option()/Argument() calls in parameter defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
