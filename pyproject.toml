[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-ai"
version = "0.1.0"
description = "A hardened security layer for AI / LLM client integrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Presidio Security" }]
keywords = ["presidio", "hardening", "security-engineering", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/presidio-v/presidio-hardened-ai"
Source = "https://github.com/presidio-v/presidio-hardened-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_ai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
