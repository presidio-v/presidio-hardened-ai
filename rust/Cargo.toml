[package]
name = "presidio_ai_zk"
version = "0.1.0"
edition = "2021"
description = "Ristretto255 + Bulletproofs bounded-norm proofs for presidio-hardened-ai (ADR-0004)"
license = "Apache-2.0"

[lib]
name = "presidio_ai_zk"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
bulletproofs = "5.0"
curve25519-dalek = { version = "4", features = ["serde"] }
merlin = "3"
rand = "0.8"
