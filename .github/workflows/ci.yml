name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --require-hashes -r .github/constraints/ci-toolchain.txt
          python -m pip install --require-hashes -r .github/constraints/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (coverage floor in pyproject.toml)
        run: pytest tests/ -x -q --cov=presidio_ai --cov-report=term
      - name: Dependency audit
        run: pip-audit

  compat:
    # The full gate runs on the 3.11 floor; this runs the suite on every newer
    # supported Python, so a version-specific break fails the pull request.
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --require-hashes -r .github/constraints/ci-toolchain.txt
          python -m pip install --require-hashes -r .github/constraints/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test
        run: pytest tests/ -x -q
