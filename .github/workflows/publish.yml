name: Publish to PyPI

# Trusted Publishing (OIDC, no stored secrets) with PEP 740 attestations.
# Runs on a signed v* tag. The publish job runs in the `release` environment,
# which has a required reviewer, so a pushed tag alone cannot publish to PyPI.
#
# PyPI setup (once, before the first release): a trusted publisher, or a pending
# publisher while the project does not exist yet, matching exactly:
#   project:     presidio-hardened-ai
#   repository:  presidio-v/presidio-hardened-ai
#   workflow:    publish.yml
#   environment: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r .github/constraints/release-build.txt
          # --no-isolation: build with the hash-pinned hatchling installed above
          # instead of letting `build` fetch an unpinned backend.
          python -m build --no-isolation
      - name: Check metadata
        run: |
          python -m pip install --require-hashes -r .github/constraints/twine.txt
          twine check --strict dist/*
      # Attest and hand off dist/ before any later job resolves packages.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Generate SBOM
        run: |
          python -m pip install --require-hashes -r .github/constraints/cyclonedx.txt
          # Describe what a user installs: the wheel and its runtime dependencies
          # in a clean venv, not the build or SBOM tooling.
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install --require-hashes -r .github/constraints/runtime.txt
          /tmp/runtime/bin/pip install --no-deps dist/*.whl
          cyclonedx-py environment /tmp/runtime/bin/python --output-format JSON --output-file sbom.cdx.json
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/presidio-hardened-ai/
    permissions:
      id-token: write # OIDC token for Trusted Publishing and sigstore
      attestations: write # PEP 740 provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  release-assets:
    name: Attach release assets
    needs: [build, sbom, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read # download the provenance bundles attested above
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: .
      - name: Collect provenance bundles
        # Attach each file's build-provenance bundle as <file>.intoto.jsonl, so
        # the release itself carries verifiable provenance (offline:
        # gh attestation verify <file> --bundle <file>.intoto.jsonl --repo ...).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir provenance
          for f in dist/* sbom.cdx.json; do
            digest=$(sha256sum "$f" | cut -d' ' -f1)
            gh attestation download "$f" --repo "$GH_REPO"
            mv "sha256:${digest}.jsonl" "provenance/$(basename "$f").intoto.jsonl"
          done
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* sbom.cdx.json provenance/*.intoto.jsonl --repo "$GH_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* sbom.cdx.json provenance/*.intoto.jsonl \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md for the changes in $GITHUB_REF_NAME."
          fi
