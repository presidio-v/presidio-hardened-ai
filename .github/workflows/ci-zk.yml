name: ZK CI

# Lane for the optional Ristretto255 + Bulletproofs backend (ADR-0004). The default lane
# runs the pure-Python MODP fallback; this lane builds the Rust/dalek native wheel from
# rust/ via maturin and cross-validates it against MODP on decision equivalence.
#
# Runs on pull requests and pushes that touch the native crate or the proof code, and on
# demand. Until 0.32.0 this lane was manual-only because the crate had never compiled
# (bulletproofs 4.0 is built on curve25519-dalek-ng, not the curve25519-dalek 4 this crate
# uses); bulletproofs 5.0 fixes that. The pure-Python MODP backend in the default lane
# remains the reference; this lane checks that the native backend reaches the same
# decisions, including the 0.32.0 two-sided L∞ and padding regressions.
on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "src/presidio_ai/fl/**"
      - "tests/test_ristretto_backend.py"
      - "tests/test_proof_backend.py"
      - ".github/workflows/ci-zk.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "src/presidio_ai/fl/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zk:
    name: pytest [zk] native backend (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Rust
        # Action code is SHA-pinned; the Rust toolchain itself still tracks stable via rustup.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: stable
          components: clippy

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings

      - name: cargo audit (RustSec advisories against Cargo.lock)
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file rust/Cargo.lock

      - name: Build + install the native backend (maturin)
        run: |
          python -m pip install --require-hashes -r .github/constraints/ci-toolchain.txt
          python -m pip install --require-hashes -r .github/constraints/zk-build.txt
          maturin build --release --locked -m rust/Cargo.toml --out dist
          python -m pip install --no-deps dist/*.whl

      - name: Install the package (dev)
        run: |
          python -m pip install --require-hashes -r .github/constraints/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint (zk lane tests + backend)
        run: |
          ruff check tests/test_ristretto_backend.py src/presidio_ai/fl/_ristretto_backend.py
          ruff format --check tests/test_ristretto_backend.py src/presidio_ai/fl/_ristretto_backend.py

      - name: Run native backend + decision-equivalence tests
        run: pytest tests/test_ristretto_backend.py -q

      - name: Run the consortium and GOD suites on the native backend
        run: pytest tests/test_secure_consortium.py tests/test_god.py tests/test_zk.py -q

      - name: Confirm the native backend is auto-selected
        run: python -c "from presidio_ai.fl.proof_backend import backend_name; assert backend_name()=='ristretto255-bulletproofs', backend_name(); print('native backend active')"
