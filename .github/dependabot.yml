version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    # The --require-hashes lockfiles the workflows install from (see constraints/README.md).
    directory: "/.github/constraints"
    schedule:
      interval: "weekly"
    groups:
      ci-lockfiles:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
