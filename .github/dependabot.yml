version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    # The --require-hashes lockfiles the workflows install from (see constraints/README.md).
    directory: "/.github/constraints"
    schedule:
      interval: "weekly"
    groups:
      ci-lockfiles:
        patterns:
          - "*"
    # torch and sympy pin these exactly; bumping them alone makes dev-torch.txt
    # unresolvable. They move when torch/sympy move (recompile the lockfile).
    ignore:
      - dependency-name: "mpmath"
      - dependency-name: "nvidia-*"
      - dependency-name: "cuda-toolkit"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
